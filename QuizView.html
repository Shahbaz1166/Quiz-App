<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Available Quizzes - SMIT LMS</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
      }

      body {
        background-color: #f8fafc;
        color: #0f172a;
        min-height: 100vh;
        padding: 30px 20px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
        padding-bottom: 16px;
        border-bottom: 1px solid #e2e8f0;
      }

      .header h1 {
        font-size: 24px;
        font-weight: 700;
        color: #0f172a;
      }

      .back-btn {
        text-decoration: none;
        color: #2563eb;
        font-size: 14px;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        transition: all 0.2s ease;
      }

      .back-btn:hover {
        background-color: #f1f5f9;
        border-color: #94a3b8;
      }

      /* Dynamic Quiz Cards Container */
      #quizList {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
        width: 100%;
      }

      /* Quiz Card Style applied to dynamic JS cards */
      .card {
        background-color: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 120px;
      }

      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.1);
        border-color: #2563eb;
      }

      .card h3,
      .card h2 {
        font-size: 16px;
        font-weight: 600;
        color: #1e293b;
      }

      @media (max-width: 600px) {
        #quizList {
          grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
          gap: 14px;
        }

        .header {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>Available Courses & Quizzes</h1>
        <a href="./dashboard.html" class="back-btn">← Back to Dashboard</a>
      </div>

      <div id="quizList"></div>
    </div>
