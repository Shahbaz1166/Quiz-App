<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Portal - SMIT LMS</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="quiz-wrapper">
      <div id="MainCard">
        <!-- Top Status Bar (Question Count & Timer) -->
        <div class="quiz-header">
          <div class="status-badge question-badge">
            <span>Question:</span>
            <b id="TotalQuestion">0 / 0</b>
          </div>
          <div class="status-badge timer-badge">
            <span>Time Left:</span>
            <b id="timer">00:00</b>
          </div>
        </div>

        <!-- Main Question & Options Container -->
        <div id="container"></div>
      </div>

      <!-- Result Card -->
      <div id="result" style="display: none"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyAQONBiI8n5d7ESOExHW9wMpVQt8wiMfF4",
        authDomain: "quiz-app-6c845.firebaseapp.com",
        databaseURL: "https://quiz-app-6c845-default-rtdb.firebaseio.com",
        projectId: "quiz-app-6c845",
        storageBucket: "quiz-app-6c845.firebasestorage.app",
        messagingSenderId: "531417377109",
        appId: "1:531417377109:web:3f340d6ccd8726aba2a7dc",
      };
      firebase.initializeApp(firebaseConfig);
    </script>
    <script src="app.js"></script>
  </body>
</html>
